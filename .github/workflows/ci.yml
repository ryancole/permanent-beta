name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: demo repair (expects exit code 1 = needs review)
        shell: bash
        run: |
          set +e
          cargo run -q -p permanent-beta-cli -- repair --old examples/demo/v1.json --new examples/demo/v2.json --hooks examples/demo/hooks.toml
          code=$?
          test "$code" -eq 1
      - name: build test fixtures with MSVC and generate answer keys
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./corpus/build-fixtures.ps1
          $truth = Get-ChildItem target/fixtures -Recurse -Filter truth.json
          if ($truth.Count -eq 0) { throw "no truth.json generated" }
          $truth | ForEach-Object { $_.FullName }
      - name: corpus gate (analyzer checks + zero wrong matches + correct-match baseline)
        if: runner.os == 'Windows'
        run: cargo test -p permanent-beta-corpus -- --ignored --nocapture
      - name: real-world corpus gate (clone, build and score zlib, lua, zstd and tinyxml2 across release tags)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./corpus/build-projects.ps1 -Score
      - name: hook-repair loop (Detours hooks repaired v1 -> v2 -> v3 and run; zero wrong relocations, identical traces)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./corpus/build-hooks.ps1 -Run
