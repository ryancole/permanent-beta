name: ci

on:
  push:
  pull_request:
  # The corpus job (below) only runs from here: Actions -> ci -> Run workflow, with "corpus" ticked. It takes far
  # too long to run on every push.
  workflow_dispatch:
    inputs:
      corpus:
        description: Build and score the corpus (fixtures, real-world projects, hook-repair loop)
        type: boolean
        default: false

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: demo repair (expects exit code 1 = needs review)
        shell: bash
        run: |
          set +e
          cargo run -q -p permanent-beta-cli -- repair --old examples/demo/v1.json --new examples/demo/v2.json --hooks examples/demo/hooks.toml
          code=$?
          test "$code" -eq 1
      - name: replay tests with the emulator (icicle running Ghidra's x86-64 SLEIGH specification)
        run: cargo test -p permanent-beta-replay -p permanent-beta-cli --features permanent-beta-replay/emulator

  dco:
    # Every commit in a pull request carries a Signed-off-by line (CONTRIBUTING.md, the DCO).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit is signed off
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line (git commit -s; see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing

  ida:
    # The IDA plugin's logic without IDA (integrations/ida/tests): export, apply rules, the pbeta client, against a
    # recorded `pbeta mappings` reply. IDA itself can't run in CI (its licence); the GUI is checked by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: plugin unit tests
        working-directory: integrations/ida
        run: python -m unittest discover -s tests -v

  host:
    # The hook host end to end (harness/host/test.ps1, about a minute): builds Detours, the host and a test app
    # twice, locates its hooks with pbeta and runs both builds under every action, handlers and generated stubs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: hook host end-to-end test
        shell: pwsh
        run: ./harness/host/test.ps1

  corpus:
    if: github.event_name == 'workflow_dispatch' && inputs.corpus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build test fixtures with MSVC and generate answer keys
        shell: pwsh
        run: |
          ./corpus/build-fixtures.ps1
          $truth = Get-ChildItem target/fixtures -Recurse -Filter truth.json
          if ($truth.Count -eq 0) { throw "no truth.json generated" }
          $truth | ForEach-Object { $_.FullName }
      - name: corpus gate (analyzer checks + zero wrong matches + correct-match baseline)
        run: cargo test -p permanent-beta-corpus -- --ignored --nocapture
      - name: real-world corpus gate (clone, build and score zlib, lua, zstd, tinyxml2 and yaml-cpp across release tags)
        shell: pwsh
        run: ./corpus/build-projects.ps1 -Score
      - name: hook-repair loop (Detours hooks repaired v1 -> v2 -> v3 and run; zero wrong relocations, identical traces; recorded cases replayed)
        shell: pwsh
        run: ./corpus/build-hooks.ps1 -Run -Replay
