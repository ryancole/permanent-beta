# Publishes site/ (plus the README banner) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/banner.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/banner.svg _site/banner.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
