# Publishes site/ to GitHub Pages: index.html, the README banner, and style.css built from site/tailwind.css.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/banner.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build stylesheet
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html site/dist/style.css _site/
          cp docs/banner.svg _site/banner.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
