[package]
name = "permanent-beta-cli"
description = "The pbeta command-line tool for Permanent Beta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pbeta"
path = "src/main.rs"

[dependencies]
permanent-beta-model.workspace = true
permanent-beta-analysis.workspace = true
permanent-beta-engine.workspace = true
permanent-beta-store.workspace = true
permanent-beta-ai.workspace = true
permanent-beta-replay.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# Replay recorded test cases by emulation (Unicorn, GPL-2.0: a pbeta built with it is GPL-2.0; design §11.5).
# Needs CMake, Ninja and libclang to build (third_party/README.md). Without it, recorded cases are inconclusive.
emulator = ["permanent-beta-replay/emulator"]
