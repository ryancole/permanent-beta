[package]
name = "permanent-beta-cli"
description = "The pbeta command-line tool for Permanent Beta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pbeta"
path = "src/main.rs"

[dependencies]
permanent-beta-model.workspace = true
permanent-beta-analysis.workspace = true
permanent-beta-engine.workspace = true
permanent-beta-store.workspace = true
permanent-beta-ai.workspace = true
permanent-beta-replay.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Rewrites a hook manifest in place keeping its comments (`pbeta bind`).
toml_edit.workspace = true

[features]
# Replay recorded test cases by emulation (icicle, MIT or Apache-2.0, running Ghidra's x86-64 SLEIGH specification,
# Apache-2.0; design §7.3, §11.5). Without it, recorded cases are inconclusive.
emulator = ["permanent-beta-replay/emulator"]
