[package]
name = "permanent-beta-replay"
description = "Replays recorded per-call test cases against a new build by emulation (design §7.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Depends on permanent-beta-model only (design §3.1).
[dependencies]
permanent-beta-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
object = { version = "0.36", default-features = false, features = ["std", "read_core", "pe"] }
sha2 = "0.10"
# Unicorn is GPL-2.0: a binary built with the `emulator` feature is GPL-2.0 (design §11.5). Building it needs
# CMake, Ninja and libclang (third_party/README.md).
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"], optional = true }

[features]
# Without it, every case replays as inconclusive ("built without the emulator").
emulator = ["dep:unicorn-engine"]
