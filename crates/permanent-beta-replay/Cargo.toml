[package]
name = "permanent-beta-replay"
description = "Replays recorded per-call test cases against a new build by emulation (design §7.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Depends on permanent-beta-model only (design §3.1).
[dependencies]
permanent-beta-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
object = { version = "0.36", default-features = false, features = ["std", "read_core", "pe"] }
sha2 = "0.10"
# icicle (MIT or Apache-2.0) executes Ghidra's SLEIGH specifications; the x86 one is embedded (sleigh/). Not on
# crates.io: pinned to a commit.
icicle-vm = { git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a", optional = true }
pcode = { git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a", optional = true }

[features]
# Without it, every case replays as inconclusive ("built without the emulator").
emulator = ["dep:icicle-vm", "dep:pcode"]
