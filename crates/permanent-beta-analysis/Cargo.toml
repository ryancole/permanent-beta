[package]
name = "permanent-beta-analysis"
description = "Turns a binary, or a tool export, into the normalized Permanent Beta AnalysisExport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
permanent-beta-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
pdb = "0.8"
object = { version = "0.36", default-features = false, features = ["std", "read_core", "pe"] }
sha2 = "0.10"
