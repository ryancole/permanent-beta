[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false
# License not chosen yet (see LICENSE and docs/design.md §11.5). Add `license = "..."` once decided.

[workspace.dependencies]
# Internal crates. Dependency rules are documented in docs/design.md §3.1 and CLAUDE.md.
permanent-beta-model = { path = "crates/permanent-beta-model" }
permanent-beta-analysis = { path = "crates/permanent-beta-analysis" }
permanent-beta-match = { path = "crates/permanent-beta-match" }
permanent-beta-verify = { path = "crates/permanent-beta-verify" }
permanent-beta-repair = { path = "crates/permanent-beta-repair" }
permanent-beta-store = { path = "crates/permanent-beta-store" }
permanent-beta-engine = { path = "crates/permanent-beta-engine" }
permanent-beta-ai = { path = "crates/permanent-beta-ai" }
permanent-beta-mcp = { path = "crates/permanent-beta-mcp" }
permanent-beta-replay = { path = "crates/permanent-beta-replay" }

# External crates.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
msvc-demangler = "0.11"
