# zlib functions hooked in minigzip to measure replay on real code (corpus/replay-measure.ps1). Prototypes use
# base C types (the record spec doesn't resolve zlib's typedefs) and PDB struct names. Record mode attaches at most
# 16 hooks.

[[hook]]
name = "adler32_z"
detour = "record"
prototype = "unsigned long adler32_z(unsigned long adler, const unsigned char* buf, size_t len)"

[hook.target]
build = "v1"
symbol = "adler32_z"

[[hook]]
name = "crc32_z"
detour = "record"
prototype = "unsigned long crc32_z(unsigned long crc, const unsigned char* buf, size_t len)"

[hook.target]
build = "v1"
symbol = "crc32_z"

