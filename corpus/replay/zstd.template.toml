# zstd functions hooked in the zstd CLI to measure replay on real code (corpus/replay-measure.ps1 -Project zstd).
# Prototypes from the PDB's signatures with enums written as int, PDB struct names, and parameter names (the
# record spec takes a buffer's length from the parameter after it). Compression and decompression, most taking
# the contexts whose layouts change between releases. Record mode attaches at most 16 hooks.

[[hook]]
name = "ZSTD_compressBound"
detour = "record"
prototype = "unsigned long long ZSTD_compressBound(unsigned long long srcSize)"

[hook.target]
build = "v1"
symbol = "ZSTD_compressBound"

