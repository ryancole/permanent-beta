# Hooks written against the sample app's v1 (corpus/hooks/README.md). Manifest format: docs/design.md §7.1.
#
# `pbeta-corpus hook-manifest` turns this into the v1 manifest: it resolves each `symbol` to its RVA through v1's
# linker map (as a hook author with v1's PDB would) and binds the locator to v1's build id. The symbol is then
# dropped: repair sees only RVAs, like a shipped manifest for a binary without symbols.
#
# Every `detour` names a detour in hookdll.cpp, written against the v1 prototype below.

[[hook]]
name = "log_event"
detour = "Hook_log_event"
prototype = "void log_event(const char* msg, int code)"

[hook.target]
build = "v1"
symbol = "log_event"

[[hook]]
name = "price_lookup"
detour = "Hook_price_lookup"
prototype = "int price_lookup(int sku)"

[hook.target]
build = "v1"
symbol = "price_lookup"

