# What each repair step of the M4 hook-repair loop must achieve (corpus/build-hooks.ps1 -Run).
#
# Always enforced: zero wrong relocations against the answer key (linker maps), and an identical trace for every
# applied hook (pbeta trace-diff). Per step and flag set:
#   min_resolved  hooks re-bound to the new build, all correctly. Raise it when the engine resolves more.
#   held          hooks that must stay in review, never applied: a changed signature (log_event gains a
#                 parameter in v2), identical code (checksum and checksum_backup in v3), and at /Od a rewritten
#                 body with no candidate (apply_discount; v2-v3 repairs it from v1, its own build).
#
# A passing behavioral check counts as one independent pass below high criticality (design §6.3). order_add is
# high: it's resolved only when its trial run passes and it has 2 independent structural passes. apply_discount
# (/O2) and ship_order (v2-v3) have no independent structural pass and are resolved by their trial runs. So
# min_resolved also gates the trial runs.
#
# Hooks resolved today (2026-11-07):
#   v1-v2 /O2: all but log_event (an unconfirmed candidate, with a prototype proposal). /Od: all but log_event
#              (verification failed, with a proposal) and apply_discount (rewritten body: unmatched).
#   v2-v3 /O2: all but checksum (ambiguous) and log_event (repaired from v1: same review). /Od: also not
#              apply_discount (repaired from v1: unmatched).

[[step]]
name = "v1-v2"
flags = "o2"
min_resolved = 7
held = ["log_event"]

[[step]]
name = "v2-v3"
flags = "o2"
min_resolved = 6
held = ["log_event", "checksum"]

[[step]]
name = "v1-v2"
flags = "od"
min_resolved = 6
held = ["log_event", "apply_discount"]

[[step]]
name = "v2-v3"
flags = "od"
min_resolved = 5
held = ["log_event", "apply_discount", "checksum"]
