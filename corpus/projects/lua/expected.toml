# Gate for the Lua corpus. Scored by `pwsh corpus/build-projects.ps1 -Project lua -Score`
# (add `--misses` to `pbeta-corpus score` to list what wasn't matched).
#
#   - zero wrong matches, always (not configurable);
#   - at least `min_correct` correct matches per variant (<flags>__<old>__<new>), counting every function from
#     Lua's own object files. Raise these when matching improves.
#
# Baseline 2026-11-06 (first run): /O2 642 of 733 and 667 of 736, /Od 1016 of 1094 and 1045 of 1096.
# The first run found one real false positive: 5.4.8 moved the "error in error handling" literal from
# luaD_seterrorobj into the new luaD_errerr, and the strings pass paired them. The strings pass now refuses a
# pair whose inferred argument counts differ (3 vs 1 here). It also found six renames in 5.4.7, declared in
# recipe.psd1 so the answer key doesn't score correct matches as wrong.
# 2026-11-06, similarity pass: /O2 706 of 733 and 714 of 736, /Od 1077 of 1094 and 1085 of 1096.

# 2026-11-07, mnemonic-hash pass and similarity margin 0.1 -> 0.05: /O2 and /O2+ICF 710 and 716, /Od 1079 and
# 1085, 0 wrong.
# 2026-11-07, import names in the normalized hash (import thunks such as `sin` and `cos` no longer all hash the
# same, so the math_* wrappers that call them are told apart): /O2 and /O2+ICF 716 and 722, /Od 1086 and 1092,
# 0 wrong.
# 2026-11-07, function starts from code pointers in data (base relocations; design §4.4): functions reached only
# through function tables (arith_*, str_find, ...) are found instead of absorbed: /O2 and /O2+ICF 726 and 732,
# /Od unchanged, 0 wrong.
# 2026-11-07, function starts after int3 padding (design §4.4): /Od 1087 and 1093, /O2 unchanged, 0 wrong.
# 2026-11-07, lowered: three matching rules added for yaml-cpp's wrong matches (design §5.1) turn a few correct
# candidates into review suggestions, never into wrong matches: the hash pass's caller veto, pairing copies by
# elimination only with an agreeing neighbour, and the broader wrapper rule in similarity. /O2 724 and 731, /Od 1086 and 1092 (was 726/732, 1087/1093).
# 2026-11-07, raised: the wrapper rule is overruled when >= 2 matched callers still call the function directly
# and none calls the would-be wrapper (design §5.1 pass 6). o2-icf__v5.4.6__v5.4.7 724 -> 726, o2-icf__v5.4.7__v5.4.8 731 -> 732, o2__v5.4.6__v5.4.7 724 -> 726, o2__v5.4.7__v5.4.8 731 -> 732, od__v5.4.6__v5.4.7 1086 -> 1087.
# 2026-11-07, new flag sets /LTCG (o2-ltcg: /GL + /LTCG) and PGO (o2-pgo: trained on the recipe's Train
# workload), first run: o2-ltcg__v5.4.6__v5.4.7 522, o2-ltcg__v5.4.7__v5.4.8 513, o2-pgo__v5.4.6__v5.4.7 839, o2-pgo__v5.4.7__v5.4.8 839, 0 wrong, with pgo_seed.h
# fixing the string-hash seed and table.sort's pivot so that training, and the PGO build, are reproducible.
# 2026-11-08, o2-pgo raised 839 -> 842 on both variants: training no longer depends on where the checkout is
# (recipe.psd1: run from the recipe directory, package.path and cpath fixed). With absolute paths, CI's checkout
# got a different profile and scored o2-pgo__v5.4.7__v5.4.8 838 (collectargs held for review). The PGO build's code
# layout is now identical from both paths. The change is in the build, not matching; 0 wrong before and after.
[gate.min_correct]
"o2__v5.4.6__v5.4.7" = 726
"o2__v5.4.7__v5.4.8" = 732
"o2-icf__v5.4.6__v5.4.7" = 726
"o2-icf__v5.4.7__v5.4.8" = 732
"od__v5.4.6__v5.4.7" = 1087
"od__v5.4.7__v5.4.8" = 1092
"o2-ltcg__v5.4.6__v5.4.7" = 522
"o2-ltcg__v5.4.7__v5.4.8" = 513
"o2-pgo__v5.4.6__v5.4.7" = 842
"o2-pgo__v5.4.7__v5.4.8" = 842
