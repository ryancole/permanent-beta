# Gate for the zlib corpus. Scored by `pwsh corpus/build-projects.ps1 -Project zlib -Score`
# (add `--misses` to `pbeta-corpus score` to list what wasn't matched).
#
#   - zero wrong matches, always (not configurable);
#   - at least `min_correct` correct matches per variant (<flags>__<old>__<new>), counting every function from
#     zlib's and minigzip's own object files. Raise these when matching improves.
#
# There are no per-scenario targets: real code isn't designed around scenarios.
#
# Baseline 2026-11-05 (first run): /O2 61 of 69 functions present in both builds, /Od 150 and 152 of 163.
# 2026-11-06, matched-callees pass: /O2 63 of 69, /Od 154 and 156 of 163 (adler32/crc32 at /O2;
# adler32_combine, crc32_combine, gztell, gzoffset at /Od: identical code told apart by matched callees).
# 2026-11-06, analyzer reads chained .pdata fragments and address-taken code: /O2 69 of 69. The six /O2
# misses were called (or had their address taken) only from chained fragments, which weren't decoded.
# The remaining /Od misses include four functions nothing references (compressBound, get_crc_table,
# zlibVersion, zError): dead code without .pdata, invisible to discovery.
# 2026-11-06, similarity pass: /Od 159 of 163 in both pairs (edited functions such as deflateBound and
# inflatePrime now reach review). The 4 left are the unreferenced dead code above.

# 2026-11-07, function starts after int3 padding (design §4.4): the unreferenced /Od functions above are found;
# /Od 161 and 160, /O2 unchanged, 0 wrong.
# 2026-11-07, new flag sets /LTCG (o2-ltcg: /GL + /LTCG) and PGO (o2-pgo: trained on the recipe's Train
# workload), first run: o2-ltcg__v1.2.13__v1.3 51, o2-ltcg__v1.3__v1.3.1 51, o2-pgo__v1.2.13__v1.3 73, o2-pgo__v1.3__v1.3.1 74, 0 wrong.
# 2026-11-13: rebaselined for MSVC 14.52 (Visual Studio 18.12; the earlier baselines were 14.50, whose
# builds differ) and the new `debug` flag set (VS Debug: /ZI /Od /RTC1 /JMC, incremental linking), with
# native-4 discovery and the stricter copy rules in the hash and matched-callees passes. 0 wrong.
[gate.min_correct]
"o2__v1.2.13__v1.3" = 70
"o2__v1.3__v1.3.1" = 70
"o2-icf__v1.2.13__v1.3" = 70
"o2-icf__v1.3__v1.3.1" = 70
"od__v1.2.13__v1.3" = 161
"od__v1.3__v1.3.1" = 160
"o2-ltcg__v1.2.13__v1.3" = 51
"o2-ltcg__v1.3__v1.3.1" = 51
"o2-pgo__v1.2.13__v1.3" = 73
"o2-pgo__v1.3__v1.3.1" = 74
"debug__v1.2.13__v1.3" = 161
"debug__v1.3__v1.3.1" = 160
