# Gate for the zlib corpus. Scored by `pwsh corpus/build-projects.ps1 -Project zlib -Score`
# (add `--misses` to `pbeta-corpus score` to list what wasn't matched).
#
#   - zero wrong matches, always (not configurable);
#   - at least `min_correct` correct matches per variant (<flags>__<old>__<new>), counting every function from
#     zlib's and minigzip's own object files. Raise these when matching improves.
#
# There are no per-scenario targets: real code isn't designed around scenarios.
#
# Baseline 2026-11-05 (first run): /O2 61 of 69 functions present in both builds, /Od 150 and 152 of 163.
# 2026-11-06, matched-callees pass: /O2 63 of 69, /Od 154 and 156 of 163 (adler32/crc32 at /O2;
# adler32_combine, crc32_combine, gztell, gzoffset at /Od: identical code told apart by matched callees).
# 2026-11-06, analyzer reads chained .pdata fragments and address-taken code: /O2 69 of 69. The six /O2
# misses were called (or had their address taken) only from chained fragments, which weren't decoded.
# The remaining /Od misses include four functions nothing references (compressBound, get_crc_table,
# zlibVersion, zError): dead code without .pdata, invisible to discovery.

[gate.min_correct]
"o2__v1.2.13__v1.3" = 69
"o2__v1.3__v1.3.1" = 69
"o2-icf__v1.2.13__v1.3" = 69
"o2-icf__v1.3__v1.3.1" = 69
"od__v1.2.13__v1.3" = 154
"od__v1.3__v1.3.1" = 156
