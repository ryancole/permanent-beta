# Gate for the zstd corpus. Scored by `pwsh corpus/build-projects.ps1 -Project zstd -Score`
# (add `--misses` to `pbeta-corpus score` to list what wasn't matched).
#
#   - zero wrong matches, always (not configurable);
#   - at least `min_correct` correct matches per variant (<flags>__<old>__<new>), counting every function from
#     zstd's own object files. Raise these when matching improves.
#
# Baseline 2026-11-06 (first run): /O2 433 of 725 and 511 of 730, /O2+ICF 426 of 695 and 508 of 700,
# /Od 1283 of 1863 and 1516 of 1890. The most churn of any corpus project, and the most room for the
# similarity pass: about 40% of /O2 functions present in both builds aren't matched yet.
# The first run found one real false positive: 1.5.7 moved ZSTD_entropyCompressSeqStore's body into a new
# ZSTD_entropyCompressSeqStore_wExtLitBuffer behind a wrapper, and the strings pass paired the old function
# with the new body. String matches are now rechecked against the final matches and vetoed when the old
# function's matched callers don't call the new one. It also found four renames, declared in recipe.psd1.
# 2026-11-06, similarity pass: /O2 623 of 726 and 669 of 731, /O2+ICF 611 of 696 and 651 of 701,
# /Od 1674 of 1866 and 1731 of 1892. Its first run flagged five functions as wrong: three undeclared renames
# (badusage, ZSTD_copySequencesToSeqStoreExplicitBlockDelim, ZSTDMT_serialState_update; now in recipe.psd1);
# BIT_reloadDStreamFast, whose body became BIT_reloadDStream_internal (declared as a per-object rename); and
# one real split: 1.5.6 moved ZSTD_findFrameCompressedSize's body into a new _advanced behind a wrapper, now
# an ambiguity via the wrapper guard.
# 2026-11-07, mnemonic-hash pass (same instruction sequence, operands changed; gated on size and an agreeing
# matched neighbour): /O2 627 and 672, /O2+ICF 614 and 654, /Od 1697 and 1738, 0 wrong. It also takes about 60
# functions per /O2 variant that similarity had sent to review and accepts them.

# 2026-11-07, similarity margin calibrated 0.1 -> 0.05 (pbeta-corpus sweep): /O2 667 and 676, /O2+ICF 653 and 662,
# /Od 1700 and 1738, 0 wrong.
# 2026-11-07, function starts from code pointers in data (base relocations; design §4.4): the block-compressor
# table's functions are found instead of absorbed: /O2 671 and 679, /O2+ICF 657 and 665, /Od unchanged, 0 wrong.
# 2026-11-07, function starts after int3 padding (design §4.4): unreferenced /Od functions are found instead of
# absorbed: /Od 1705 and 1744 (accepted 2 fewer per variant, now in review), /O2 unchanged, 0 wrong.
[gate.min_correct]
"o2__v1.5.5__v1.5.6" = 671
"o2__v1.5.6__v1.5.7" = 679
"o2-icf__v1.5.5__v1.5.6" = 657
"o2-icf__v1.5.6__v1.5.7" = 665
"od__v1.5.5__v1.5.6" = 1705
"od__v1.5.6__v1.5.7" = 1744
