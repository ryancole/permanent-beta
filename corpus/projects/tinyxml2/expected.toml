# Gate for the TinyXML-2 corpus (the first C++ project). Scored by
# `pwsh corpus/build-projects.ps1 -Project tinyxml2 -Score` (add `--misses` to `pbeta-corpus score` to list what
# wasn't matched).
#
#   - zero wrong matches, always (not configurable);
#   - at least `min_correct` correct matches per variant (<flags>__<old>__<new>), counting every function from
#     the project's own object files (STL instantiations included) except exception-handling funclets.
#
# Baseline 2026-11-07 (first run): /O2 196 of 268 and 194 of 266, /O2+ICF 203 of 229 and 199 of 227, /Od 392 of
# 473 and 395 of 475, 0 wrong. Functions reachable only through vtables are found (base relocations): only 5-15
# per variant are unmatched. Most misses are ambiguous, sent to review: the tiny virtual overrides that are
# byte-identical across classes (XMLNode's ToElement, ToText, ... returning null; MemPoolT's Free and SetTracked
# per instantiation).
#
# The first run reported 5-18 wrong per variant, all in the answer key, not the engine: decorated names encode
# signatures (10.1.0 changed int sizes to size_t; XMLDocument::Identify gained a bool parameter) and the scope
# number of main's local class TestUtil, so the same function had a new name; and `main$dtor$N` funclets are
# renumbered when main changes. The answer key now joins C++ names by their undecorated name and leaves
# funclets out (crates/permanent-beta-corpus/src/truth.rs).
# 2026-11-07, table-slot pass (design §5.1 pass 5b): identical virtuals told apart by their vtable slot. /O2 247
# and 233 (+51, +39), /O2+ICF 212 and 204, /Od 436 and 433 (+44, +38), 0 wrong. Most of the new ones go to review:
# table position implies no verification check, and a tiny `return null` has nothing else to check.
[gate.min_correct]
"o2__9.0.0__10.0.0" = 247
"o2__10.0.0__10.1.0" = 233
"o2-icf__9.0.0__10.0.0" = 212
"o2-icf__10.0.0__10.1.0" = 204
"od__9.0.0__10.0.0" = 436
"od__10.0.0__10.1.0" = 433
